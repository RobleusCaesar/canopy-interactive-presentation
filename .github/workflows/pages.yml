name: Deploy presentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          PAGES_BASE_PATH: /canopy-interactive-presentation
      # Vinext exports the base-path assets below a matching directory. GitHub
      # Pages already strips that path before resolving files, so place the
      # generated asset directory at the artifact root as well.
      - run: cp -R dist/client/canopy-interactive-presentation/_next dist/client/_next
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - uses: actions/deploy-pages@v4
        id: deployment
